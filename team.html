<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrappasta Productions</title>

    <!-- CSS LINK -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- FONT LINK -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <script src="https://kit.fontawesome.com/9ea3e41a62.js" crossorigin="anonymous"></script>

    <style>

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
    
        body {
          font-family: Arial, sans-serif;
        }
    
        /* First section */
        #hero {
          height: 100vh;
          background: lightblue;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 3rem;
        }
    
        /* Navbar */
        nav {
          position: fixed;
          top: -100px;
          left: 0;
          width: 100%;
          padding: 20px;
          background: black;
          color: white;
          transition: top 0.3s ease;
          z-index: 1000;
        }
    
        /* Show navbar after scrolling */
        nav.show {
          top: 0;
        }
    
        /* Extra content */
        .content {
          height: 200vh;
          padding: 50px;
          background: #f5f5f5;
        }

    </style>
    

</head>
<body>

    <div id="meettheteam-hero">
        hero section

    </div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html"><img src="img/primary-logo.png" alt=""></a>
            <div>
                <ul class="nav-ul">
                    <a href="">
                        <li class="nav-li">Work</li>
                    </a>
                    <a href="about-us.html">
                        <li class="nav-li">About</li>
                    </a>
                    <a href="the-exp.html">
                        <li class="nav-li">Contact</li>
                    </a>
                </ul>
            </div>
        </div>
    </nav>

    <main>

        <div class="meettheteam-content">
            scroll down to see the navbar appear
        </div>

    </main>

    <script>
        const navbar = document.getElementById("navbar");
        const hero = document.getElementById("hero");
    
        window.addEventListener("scroll", () => {
          if (window.scrollY > hero.offsetHeight) {
            navbar.classList.add("show");
          } else {
            navbar.classList.remove("show");
          }
        });
      </script>

</body>
</html>
